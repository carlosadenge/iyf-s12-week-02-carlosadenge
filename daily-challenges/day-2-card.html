<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 2 - Card Component</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            padding: 2rem;
            background: #f1f5f9;
        }

        h1 {
            margin-bottom: 2rem;
        }

        .card {
            width: 320px;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.15);
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .card-body {
            padding: 1.25rem;
        }

        .card-body h3 {
            margin: 0 0 0.5rem 0;
            font-size: 1.25rem;
        }

        .card-body p {
            color: #64748b;
            margin-bottom: 1rem;
            font-size: 0.95rem;
        }

        .tags {
            margin-bottom: 1rem;
        }

        .tag {
            display: inline-block;
            background: #e0e7ff;
            color: #3730a3;
            font-size: 0.75rem;
            padding: 0.25rem 0.6rem;
            border-radius: 999px;
            margin-right: 0.4rem;
        }

        .btn {
            display: inline-block;
            padding: 0.6rem 1.2rem;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background 0.3s ease;
        }

        .btn:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>

    <h1>Day 2 – Card Component</h1>

    <div class="card">
        <img src="https://placehold.co/400x200" alt="Project preview">
        <div class="card-body">
            <h3>Portfolio Website</h3>
            <p>A responsive personal portfolio built with HTML, CSS and Flexbox during IYF Academy.</p>
            
            <div class="tags">
                <span class="tag">HTML</span>
                <span class="tag">CSS</span>
                <span class="tag">Responsive</span>
            </div>

            <a href="#" class="btn">View Project</a>
        </div>
    </div>

</body>
</html>
